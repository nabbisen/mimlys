[package]
name = "mimlys-mcp"
description = "mimlys MCP client adapter: stdio servers, discovery and pinning, effect declarations, destination validation."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
# A scripted stdio MCP server for tests (hand-written JSON-RPC, no SDK
# server features: REQ-MCP-010). Never part of a release binary.
test-server = []

[dependencies]
mimlys-core = { path = "../mimlys-core", version = "0.9.0" }
rmcp = { version = "=3.9.0", default-features = false, features = ["client", "transport-child-process"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["process", "rt-multi-thread"] }
tokio-util = "0.7"
process-wrap = { version = "10", default-features = false, features = ["tokio1", "process-group", "job-object", "kill-on-drop"] }
tracing.workspace = true
thiserror.workspace = true

[lints]
workspace = true
