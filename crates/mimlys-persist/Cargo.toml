[package]
name = "mimlys-persist"
description = "mimlys persistence: SQLite store and content-addressed snapshot store."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
sha2.workspace = true
mimlys-core = { path = "../mimlys-core", version = "0.7.1" }
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true

[features]
# Aborts the process at a named persistence point (REQ-TEST-007); tests only.
crash-injection = []

[dev-dependencies]
mimlys-core = { path = "../mimlys-core", version = "0.7.1", features = ["test-support"] }
tempfile = "3"

[lints]
workspace = true
