# SPIKE S1b (handoff 011c section 3b): the four open points of RFC 011 Amendment 2 on macOS.
# Exists on the branch s1b-macos-seatbelt only; never merged. Triggered by pushes to that branch.
name: spike-s1b
on:
  push:
    branches: [s1b-macos-seatbelt]
permissions:
  contents: read
jobs:
  seatbelt:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # the `stable` branch on 2026-11-03
        with:
          toolchain: stable
      - name: the questions
        run: bash tools/s1-seatbelt/s1b.sh "$(cat tools/s1-seatbelt/QUESTIONS)"
