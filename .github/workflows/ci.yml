# CI gate (REQ-TEST-014): format, lints, tests and build on Linux (x86_64 and
# aarch64), Windows and macOS; the build and tests on the minimum Rust version; the packaging
# dry-run; dependency audit, license check, core-dependency rule, RFC
# invariants and documentation checks on Linux; the Verus proof of the
# permission-lock decision on Linux (REQ-TEST-018). What each job verifies is
# written in docs/src/maintainers/repository-guards.md.
#
# Rules for this file: actions are pinned by commit hash with the release in
# a comment; tools are pinned (mdbook, cargo-deny), never `latest`; a new job never
# changes what an existing job runs.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # the `stable` branch on 2026-11-03
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo build --workspace --all-targets
      # The interpreter the tests install (REQ-SBX-001, handoff 005b): fetched
      # once per job with retries, verified against the pinned SHA-256 (read
      # from crates/mimlys-exec/src/interpreters.rs), cached by that hash, and
      # used by the tests through MIMLYS_QJS_WASM instead of a download of
      # their own.
      - id: qjs
        shell: bash
        run: echo "sha256=$(scripts/pinned-interpreter.sh sha256)" >> "$GITHUB_OUTPUT"
      - id: qjs-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/qjs/qjs-wasi.wasm
          key: qjs-wasi-${{ steps.qjs.outputs.sha256 }}
      - if: steps.qjs-cache.outputs.cache-hit != 'true'
        shell: bash
        run: scripts/fetch-interpreter.sh "$RUNNER_TEMP/qjs/qjs-wasi.wasm"
      - shell: bash
        run: echo "MIMLYS_QJS_WASM=$RUNNER_TEMP/qjs/qjs-wasi.wasm" >> "$GITHUB_ENV"
      # Skips are recorded by `common::skip` (libtest hides a passing test's
      # output); clear the file so that a restored cache cannot add lines.
      - run: rm -f target/tmp/skips.log
        shell: bash
      - run: cargo test --workspace --all-features --no-fail-fast
      # The suite, served (handoff 014c, "Tests"): every integration test of `mimlys` again, its
      # environment's commands going through a daemon that the harness starts for the environment
      # (crates/mimlys/tests/common/served.rs). A test that cannot be served says why, by name,
      # in the skips below. On every platform of the matrix (a socket on Linux and macOS, a pipe on
      # Windows; handoff 014d). A step of the job,
      # not a job: it adds no check of its own to the count.
      #
      # The served run keeps its skips in a file of its own (`skips-served.log`): the embedded
      # run's `skips.log` is put aside for it and back after, so that "skipped tests on <runner>"
      # counts the embedded run alone, and the tests that are not
      # served are counted by their own line, `not served on <runner>` (handoff 014c-5, item 3).
      - name: the suite served by a daemon
        shell: bash
        run: |
          mkdir -p target/tmp
          rm -f target/tmp/skips-served.log target/tmp/skips-embedded.log
          if [ -f target/tmp/skips.log ]; then mv target/tmp/skips.log target/tmp/skips-embedded.log; fi
          status=0
          MIMLYS_TEST_SERVED=1 cargo test -p mimlys --all-features --tests --no-fail-fast || status=$?
          if [ -f target/tmp/skips.log ]; then mv target/tmp/skips.log target/tmp/skips-served.log; fi
          if [ -f target/tmp/skips-embedded.log ]; then mv target/tmp/skips-embedded.log target/tmp/skips.log; fi
          exit "$status"
      # REQ-CONF-013 (handoff 013d item 3): the CPU part of clause C on a real
      # cgroup. The job's own cgroup is not writable, so the suites above run on
      # the subreaper rung. This step runs the two suites that touch the cgroup
      # rung in a systemd unit with delegation, owned by the runner user
      # (scripts/with-delegated-cgroup.sh): the worker in its leaf and `cpu.max` on
      # `tool` as the kernel holds them, and the tree kill through `cgroup.kill`.
      # The cgroup passes `memory` on too (handoff 013d-4 item 4), so clause M takes
      # its cgroup rung (`memory.max`, with swap disabled below the base): the
      # second run prints the clause table, whose `memory` line names the rung, and
      # the test itself fails if the rung is not `cgroup_memory_max` here.
      # A step of the job, not a job: it adds no check of its own to the count.
      - name: the CPU part, clause M and the tree kill in a delegated cgroup
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo systemd-run --wait --pipe --collect -p Delegate=yes -p User="$USER" \
            -p WorkingDirectory="$PWD" \
            --setenv=HOME="$HOME" --setenv=PATH="$PATH" \
            --setenv=CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}" \
            --setenv=RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}" \
            --setenv=MIMLYS_QJS_WASM="$MIMLYS_QJS_WASM" \
            sh scripts/with-delegated-cgroup.sh sh -ec '
              cargo test --workspace --all-features --test m7b_cpu_part --test m6a_host_tools
              cargo test --workspace --all-features --test m6a_host_tools m6a_clauses_hold_inside_a_host_tool -- --nocapture'
      - name: skipped tests, counted per platform
        if: always()
        shell: bash
        run: |
          f=target/tmp/skips.log
          if [ -s "$f" ]; then n=$(wc -l < "$f"); else n=0; fi
          {
            echo "skipped tests on ${{ matrix.os }}: $n"
            if [ "$n" -gt 0 ]; then cat "$f"; fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
      # The tests of the served run that cannot be served (each says why, by its name): their
      # own line, apart from the skips above (handoff 014c-5, item 3). A skip of the served run
      # that is not a `not served` is counted on a line of its own too, and is expected to be 0, except
      # on windows-latest, where the two tests the embedded run skips run again, and skip again.
      - name: tests not served, counted per platform
        if: always()
        shell: bash
        run: |
          f=target/tmp/skips-served.log
          n=0
          other=0
          if [ -s "$f" ]; then
            n=$(grep -c ': not served: ' "$f" || true)
            other=$(grep -vc ': not served: ' "$f" || true)
          fi
          {
            echo "not served on ${{ matrix.os }}: $n"
            if [ "$n" -gt 0 ]; then grep ': not served: ' "$f"; fi
            echo "other skips of the served run on ${{ matrix.os }}: $other"
            if [ "$other" -gt 0 ]; then grep -v ': not served: ' "$f"; fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
      # The Linux full tier is asserted (REQ-PLAT-003, handoff 002d item 11): a
      # Linux job fails when a skip's reason is the tier. The rule, and what it
      # allows by name, is scripts/check-skip-tier.sh (repository-guards.md §1).
      # The served run's skips are held to it too.
      - name: the Linux full tier holds (no skip on the tier)
        if: always() && runner.os == 'Linux'
        shell: bash
        run: |
          sh scripts/check-skip-tier.sh target/tmp/skips.log
          sh scripts/check-skip-tier.sh target/tmp/skips-served.log

  # REQ-PLAT-002 (macOS x86_64): the Intel build and tests under Rosetta on the
  # arm runner. A job of its own, so a Rosetta problem never hides the native
  # macOS result. Rosetta runs Intel user code on Apple's kernel: it does not
  # show an Intel Mac's kernel (repository-guards.md §1).
  rosetta:
    name: macOS x86_64 under Rosetta
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: softwareupdate --install-rosetta --agree-to-license
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # the `stable` branch on 2026-11-03
        with:
          toolchain: stable
          targets: x86_64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: rosetta
      # The interpreter the tests install (REQ-SBX-001, handoff 005b): fetched
      # once per job with retries, verified against the pinned SHA-256 (read
      # from crates/mimlys-exec/src/interpreters.rs), cached by that hash, and
      # used by the tests through MIMLYS_QJS_WASM instead of a download of
      # their own.
      - id: qjs
        shell: bash
        run: echo "sha256=$(scripts/pinned-interpreter.sh sha256)" >> "$GITHUB_OUTPUT"
      - id: qjs-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/qjs/qjs-wasi.wasm
          key: qjs-wasi-${{ steps.qjs.outputs.sha256 }}
      - if: steps.qjs-cache.outputs.cache-hit != 'true'
        shell: bash
        run: scripts/fetch-interpreter.sh "$RUNNER_TEMP/qjs/qjs-wasi.wasm"
      - shell: bash
        run: echo "MIMLYS_QJS_WASM=$RUNNER_TEMP/qjs/qjs-wasi.wasm" >> "$GITHUB_ENV"
      # With `--target`, CARGO_TARGET_TMPDIR is `target/<triple>/tmp` (verified), not `target/tmp`.
      - run: rm -f target/x86_64-apple-darwin/tmp/skips.log
        shell: bash
      - run: cargo test --workspace --all-features --target x86_64-apple-darwin --no-fail-fast
      - name: skipped tests, counted per platform
        if: always()
        shell: bash
        run: |
          f=target/x86_64-apple-darwin/tmp/skips.log
          if [ -s "$f" ]; then n=$(wc -l < "$f"); else n=0; fi
          {
            echo "skipped tests on macOS x86_64 under Rosetta: $n"
            if [ "$n" -gt 0 ]; then cat "$f"; fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

  # REQ-PLAT-001, REQ-TEST-014: the stated minimum Rust version is real. The
  # version is read from the workspace manifest, so it is written once.
  msrv:
    name: minimum Rust version
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: msrv
        run: echo "version=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml | head -n1)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # the `stable` branch on 2026-11-03
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: rustc --version
      - run: cargo build --workspace --all-targets
      # The interpreter the tests install (REQ-SBX-001, handoff 005b): fetched
      # once per job with retries, verified against the pinned SHA-256 (read
      # from crates/mimlys-exec/src/interpreters.rs), cached by that hash, and
      # used by the tests through MIMLYS_QJS_WASM instead of a download of
      # their own.
      - id: qjs
        shell: bash
        run: echo "sha256=$(scripts/pinned-interpreter.sh sha256)" >> "$GITHUB_OUTPUT"
      - id: qjs-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/qjs/qjs-wasi.wasm
          key: qjs-wasi-${{ steps.qjs.outputs.sha256 }}
      - if: steps.qjs-cache.outputs.cache-hit != 'true'
        shell: bash
        run: scripts/fetch-interpreter.sh "$RUNNER_TEMP/qjs/qjs-wasi.wasm"
      - shell: bash
        run: echo "MIMLYS_QJS_WASM=$RUNNER_TEMP/qjs/qjs-wasi.wasm" >> "$GITHUB_ENV"
      # Skips are recorded by `common::skip` (libtest hides a passing test's
      # output); clear the file so that a restored cache cannot add lines.
      - run: rm -f target/tmp/skips.log
        shell: bash
      - run: cargo test --workspace --all-features --no-fail-fast
      - name: skipped tests, counted per platform
        if: always()
        shell: bash
        run: |
          f=target/tmp/skips.log
          if [ -s "$f" ]; then n=$(wc -l < "$f"); else n=0; fi
          {
            echo "skipped tests on the minimum Rust version: $n"
            if [ "$n" -gt 0 ]; then cat "$f"; fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

  # REQ-TEST-014: the six crates package and verify, in dependency order,
  # without uploading anything.
  package:
    name: packaging dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # the `stable` branch on 2026-11-03
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo publish --workspace --dry-run

  deny:
    name: dependency audit and licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # the `stable` branch on 2026-11-03
        with:
          toolchain: stable
      # cargo-deny, at the version the pinned Docker action shipped (0.20.2),
      # installed from crates.io and cached like mdbook: that action built a
      # container on every run whose Dockerfile fetched the release with
      # `curl --silent -L | tar`, without --fail or a retry (HTTP 504 on
      # 2026-11-08). The advisory database is still fetched by cargo-deny
      # itself from github.com/RustSec/advisory-db on every run; a failed
      # fetch fails the job (it does not fall back to a stale copy).
      - id: deny-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cargo/bin/cargo-deny
          key: cargo-deny-0.20.2-${{ runner.os }}
      - if: steps.deny-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-deny --locked --version 0.20.2
      # The command the action ran: its defaults were `--all-features`,
      # `--manifest-path ./Cargo.toml` and `--log-level warn`.
      - run: cargo deny --all-features --log-level warn check advisories licenses bans sources

  rules:
    name: core dependencies, RFCs, documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # the `stable` branch on 2026-11-03
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: scripts/check-core-deps.sh
      - run: scripts/check-unsafe.sh
      - run: scripts/check-rfcs.sh
      - run: scripts/check-doc-refs.sh
      # Report only (repository-guards.md §3): lists the requirements and
      # invariants no test names; it fails the job only on a malformed map.
      - run: scripts/check-req-tests.sh
      # mdbook, the pinned version, from crates.io (not a GitHub release
      # download, which failed with HTTP 504 on 2026-11-08) and cached.
      - id: mdbook-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cargo/bin/mdbook
          key: mdbook-0.5.4-${{ runner.os }}
      - if: steps.mdbook-cache.outputs.cache-hit != 'true'
        run: cargo install mdbook --version 0.5.4 --locked
      - run: mdbook build docs

  # REQ-TEST-018 (RFC 016, handoff 016): the Verus proof of the permission-lock
  # decision. Linux only; the Verus release is pinned and its archive's SHA-256
  # compared (scripts/fetch-verus.sh, the download rules of handoff 005b), the
  # unpacked directory cached by that script's hash; the Rust toolchain is the
  # one Verus names (1.99.1) and moves only with a Verus upgrade, not with
  # `stable`. After the proof passes, the vacuity guard maps a second `Held`
  # to `Write` and requires the proof to FAIL.
  verus:
    name: Verus proof (permission-lock decision)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # the `stable` branch on 2026-11-03
        with:
          toolchain: 1.99.1
      - id: verus-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/verus
          key: verus-${{ hashFiles('scripts/fetch-verus.sh') }}
      - if: steps.verus-cache.outputs.cache-hit != 'true'
        run: scripts/fetch-verus.sh "$RUNNER_TEMP/verus"
      - run: echo "$RUNNER_TEMP/verus" >> "$GITHUB_PATH"
      - run: verus --version
      - name: the proof
        run: |
          set -o pipefail
          sh verify/run.sh --time | tee "$RUNNER_TEMP/verus-run.txt"
          grep -q 'verification results:: [0-9]* verified, 0 errors' "$RUNNER_TEMP/verus-run.txt"
      - name: the vacuity guard (mutation m1 must fail the proof)
        run: sh verify/guard.sh
      - name: the production file is untouched
        run: git diff --exit-code
