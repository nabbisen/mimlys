# CI gate (REQ-TEST-014): format, lints, tests and build on Linux, Windows and
# macOS; the build and tests on the minimum Rust version; the packaging
# dry-run; dependency audit, license check, core-dependency rule, RFC
# invariants and documentation checks on Linux. What each job verifies is
# written in docs/src/maintainers/repository-guards.md.
#
# Rules for this file: actions are pinned by commit hash with the release in
# a comment; tools are pinned (mdbook), never `latest`; a new job never
# changes what an existing job runs.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # the `stable` branch on 2026-11-03
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo build --workspace --all-targets
      - run: cargo test --workspace --all-features --no-fail-fast

  # REQ-PLAT-002 (macOS x86_64): the Intel build and tests under Rosetta on the
  # arm runner. A job of its own, so a Rosetta problem never hides the native
  # macOS result. Rosetta runs Intel user code on Apple's kernel: it does not
  # show an Intel Mac's kernel (repository-guards.md §1).
  rosetta:
    name: macOS x86_64 under Rosetta
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: softwareupdate --install-rosetta --agree-to-license
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # the `stable` branch on 2026-11-03
        with:
          toolchain: stable
          targets: x86_64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: rosetta
      - run: rm -f target/tmp/skips.log
        shell: bash
      - run: cargo test --workspace --all-features --target x86_64-apple-darwin --no-fail-fast
      - name: skipped tests, counted per platform
        if: always()
        shell: bash
        run: |
          f=target/tmp/skips.log
          if [ -s "$f" ]; then n=$(wc -l < "$f"); else n=0; fi
          {
            echo "skipped tests on macOS x86_64 under Rosetta: $n"
            if [ "$n" -gt 0 ]; then cat "$f"; fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

  # REQ-PLAT-001, REQ-TEST-014: the stated minimum Rust version is real. The
  # version is read from the workspace manifest, so it is written once.
  msrv:
    name: minimum Rust version
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: msrv
        run: echo "version=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml | head -n1)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # the `stable` branch on 2026-11-03
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: rustc --version
      - run: cargo build --workspace --all-targets
      - run: cargo test --workspace --all-features --no-fail-fast

  # REQ-TEST-014: the six crates package and verify, in dependency order,
  # without uploading anything.
  package:
    name: packaging dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # the `stable` branch on 2026-11-03
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo publish --workspace --dry-run

  deny:
    name: dependency audit and licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories licenses bans sources

  rules:
    name: core dependencies, RFCs, documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # the `stable` branch on 2026-11-03
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: scripts/check-core-deps.sh
      - run: scripts/check-unsafe.sh
      - run: scripts/check-rfcs.sh
      - run: scripts/check-doc-refs.sh
      # Report only (repository-guards.md §3): lists the requirements and
      # invariants no test names; it fails the job only on a malformed map.
      - run: scripts/check-req-tests.sh
      - uses: peaceiris/actions-mdbook@ee69d230fe19748b7abf22df32acaa93833fad08 # v2.0.0
        with:
          mdbook-version: 0.5.4
      - run: mdbook build docs
