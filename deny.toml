# cargo-deny configuration (REQ-SEC-012, REQ-TEST-014).

[advisories]
version = 2
yanked = "deny"
# Accepted exceptions, each with its reason and the condition that ends it (threat register,
# "Residual risks, accepted"; THR-12). Review at every upgrade of the crate that pulls it in.
ignore = [
  # chrono is unmaintained (2026-11-17), not vulnerable. It is a required dependency of rmcp
  # (3.9.0, and 3.10.0 too), the pinned MCP SDK (REQ-ARCH-007), and no version without it exists.
  # mimlys does not use chrono itself. Remove when rmcp no longer depends on it.
  { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained; required by rmcp, no release without it; not a vulnerability" },
]

[licenses]
version = 2
# The allow list anticipates common dependency licenses; unused entries are not errors.
unused-allowed-license = "allow"
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CC0-1.0",
  "MPL-2.0",
  "OpenSSL",
  # webpki-roots (the certificate store of ureq/rustls, used only by `mimlys interpreters install`)
  "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
