# cargo-deny configuration (REQ-SEC-012, REQ-TEST-014).

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# The allow list anticipates common dependency licenses; unused entries are not errors.
unused-allowed-license = "allow"
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CC0-1.0",
  "MPL-2.0",
  "OpenSSL",
  # webpki-roots (the certificate store of ureq/rustls, used only by `mimlys interpreters install`)
  "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
